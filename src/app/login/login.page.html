<ion-header>
</ion-header>

<ion-content class="modern-login-content">
  <div class="login-container">
    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-circle">
        <ion-icon name="person-circle-outline"></ion-icon>
      </div>
      <h1 class="app-title">Welcome Back</h1>
      <p class="app-subtitle">Sign in to continue your journey</p>
    </div>

    <!-- Form Section -->
    <div class="form-section">
      <div class="input-group">
        <div class="input-wrapper">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <ion-input 
            placeholder="Email address" 
            type="email" 
            class="modern-input" 
            #email
            fill="outline">
          </ion-input>
        </div>
        
        <div class="input-wrapper">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <ion-input 
            placeholder="Password" 
            [type]="showPassword ? 'text' : 'password'" 
            class="modern-input" 
            #password
            fill="outline">
          </ion-input>
          <ion-icon 
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" 
            class="password-toggle-icon"
            (click)="togglePasswordVisibility()">
          </ion-icon>
        </div>
      </div>

      <!-- Forgot Password -->
      <div class="forgot-password">
        <ion-button 
          fill="clear" 
          size="small" 
          [routerLink]="['/forgot-password']" 
          (click)="dismiss()"
          class="forgot-link">
          Forgot Password?
        </ion-button>
      </div>

      <!-- Login Button -->
      <ion-button 
        expand="block" 
        class="login-button"
        (click)="login(email, password)"
        [disabled]="loading">
        <ion-spinner 
          *ngIf="loading" 
          name="crescent" 
          slot="start" 
          class="button-spinner">
        </ion-spinner>
        <ion-icon 
          *ngIf="!loading" 
          name="log-in-outline" 
          slot="start">
        </ion-icon>
        <span *ngIf="!loading">LOGIN</span>
        <span *ngIf="loading">SIGNING IN...</span>
      </ion-button>

      <!-- Close Button -->
      <div class="alternative-actions" style="color: black;">
        <p class="signup-prompt">
          Don't have an account? 
      <ion-button 
            fill="clear" 
            size="small" 
            [routerLink]="['/register']"
            class="signup-link">
            Sign up here
      </ion-button>
        </p>
      </div>
    </div>
  </div>
</ion-content>
