<ion-content class="forgot-password-content">
  <div class="container">
    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-container">
        <ion-img src="assets/img/linkupup.png" alt="App Logo" class="logo"></ion-img>
      </div>
      <div class="brand-text">
        <h1 class="multicolortext">Linking you to your future</h1>
      </div>
    </div>

    <!-- Form Section -->
    <div class="form-section">
      <div class="form-container">
        <div class="form-header">
          <h2>Reset Your Password</h2>
          <p class="form-subtitle">
            Please provide the email address that you used to create your Linkit-Up account.
          </p>
        </div>

        <form class="reset-form">
          <div class="input-group">
            <ion-item class="custom-item" lines="none">
              <ion-icon slot="start" name="mail-outline" class="input-icon"></ion-icon>
              <ion-input 
                placeholder="Enter your email address" 
                type="email" 
                required 
                #email
                class="custom-input">
              </ion-input>
            </ion-item>
          </div>

          <div class="button-group">
            <ion-button 
              color="primary" 
              type="submit" 
              expand="block"
              class="reset-button"
              (click)="forgotPassword(email.value)">
              <ion-icon name="send-outline" slot="start"></ion-icon>
              Send Reset Link
            </ion-button>
          </div>

          <div class="success-message" *ngIf="message">
            <div class="alert-content">
              <ion-icon name="checkmark-circle-outline" class="success-icon"></ion-icon>
              <div class="alert-text">
                <h3>Email Sent Successfully!</h3>
                <p>Please check your email for password reset instructions.</p>
              </div>
            </div>
          </div>
        </form>

        <!-- Back to Login -->
        <div class="back-link">
          <ion-button fill="clear" color="medium" routerLink="/login">
            <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
            Back to Login
          </ion-button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
